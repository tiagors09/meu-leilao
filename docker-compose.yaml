services:
  postgres:
    image: postgres:16-alpine
    container_name: leilao_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha123}
      POSTGRES_DB: ${DB_NAME:-leilao_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/backend/src/config/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-leilao_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leilao-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: leilao_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - leilao-net

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: leilao_backend
    restart: always
    ports:
      - "${PORT_BACKEND:-3000}:3000"
    environment:
      PORT_BACKEND: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-senha123}@postgres:5432/${DB_NAME:-leilao_db}
      JWT_SECRET: ${JWT_SECRET:-defina_um_segredo_longo_e_aleatorio}
      EXTERNAL_ITEMS_API_URL: ${EXTERNAL_ITEMS_API_URL:-https://dummyjson.com}
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/shared:/app/packages/shared
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - leilao-net

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: leilao_frontend
    restart: always
    ports:
      - "${PORT_FRONTEND:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${PORT_BACKEND:-3000}/api
    volumes:
      - ./packages/frontend:/app/packages/frontend
    depends_on:
      - backend
    networks:
      - leilao-net

volumes:
  pgdata:

networks:
  leilao-net:
    driver: bridge
