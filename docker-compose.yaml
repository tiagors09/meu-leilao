version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leilao_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - leilao-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: leilao_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - leilao-net

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: leilao_backend
    restart: always
    ports:
      - "${PORT_BACKEND}:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/shared:/app/packages/shared
    depends_on:
      - postgres
    networks:
      - leilao-net

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: leilao_frontend
    restart: always
    ports:
      - "${PORT_FRONTEND}:5173"
    environment:
      - VITE_API_URL=http://localhost:${PORT_BACKEND}
    volumes:
      - ./packages/frontend:/app/packages/frontend
    depends_on:
      - backend
    networks:
      - leilao-net

volumes:
  pgdata:

networks:
  leilao-net:
    driver: bridge